name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops_dev_password
          POSTGRES_DB: fleetops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fleetops -d fleetops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-secret-key-not-for-production-please
      DATABASE_URL: postgresql+asyncpg://fleetops:fleetops_dev_password@localhost:5432/fleetops
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.5.x"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      - name: Lint (ruff)
        working-directory: backend
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check (mypy)
        working-directory: backend
        run: uv run mypy app
      - name: Apply migrations
        working-directory: backend
        run: uv run alembic upgrade head
      - name: Run tests
        working-directory: backend
        run: uv run pytest -v

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
